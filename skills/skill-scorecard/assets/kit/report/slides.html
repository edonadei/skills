<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Scorecard Slides</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800;900&display=swap">
<style>
/* The scorecard's 4 images for X: 1440x1200 (6:5, what X's carousel shows uncropped).
   Swiss poster world, and every mark on slides 1-3 is one real graded run.
   Poster: Swiss print. One enormous number per slide, heavy black rules,
   a strict left-aligned grid, one red accent. README claims that failed are struck out. */
:root {
  --bg: #ecedea; --ink: #0e0e0e; --ink-2: #4f5256; --grey: #6f7276; --rule: #0e0e0e; --light: #d3d5d1;
  --red: #e1251b; --win: #1f7a45;
  --font: "Schibsted Grotesk", "Helvetica Neue", Helvetica, Arial, sans-serif;
}
* { box-sizing: border-box; }
body { margin: 0; background: #777; display: grid; gap: 40px; padding: 40px; justify-content: center; }
.slide { width: 1440px; height: 1200px; background: var(--bg); color: var(--ink); font-family: var(--font);
  padding: 0 88px; display: flex; flex-direction: column; position: relative; overflow: hidden; }
.top { border-top: 14px solid var(--ink); margin-top: 72px; }
.giant { font: 900 410px/0.78 var(--font); letter-spacing: -0.06em; margin: 74px 0 0 -8px; font-variant-numeric: tabular-nums; }
.giant.red { color: var(--red); }
.giant small { font-size: 0.42em; letter-spacing: -0.04em; color: var(--grey); }
.label { font: 700 30px/1.1 var(--font); text-transform: uppercase; letter-spacing: 0.02em; margin-top: 22px; }
h1 { font: 800 92px/0.96 var(--font); letter-spacing: -0.035em; margin: 58px 0 0; text-wrap: balance; max-width: 1050px; }
.rule { border-top: 5px solid var(--rule); }
.bottom { margin-top: auto; padding-bottom: 64px; }
.strip { display: grid; grid-template-columns: repeat(3, 1fr); }
.strip > div { padding: 20px 24px 0 0; }
.strip > div + div { border-left: 2px solid var(--ink); padding-left: 24px; }
.strip b { display: block; font: 800 84px/1 var(--font); letter-spacing: -0.04em; font-variant-numeric: tabular-nums; }
.strip span { font: 600 22px/1.2 var(--font); text-transform: uppercase; letter-spacing: 0.03em; color: var(--ink-2); }
.verdict { position: absolute; right: 88px; top: 146px; background: var(--red); color: #fff; padding: 22px 26px 18px;
  font: 900 54px/0.9 var(--font); letter-spacing: -0.01em; text-transform: uppercase; }
.verdict small { display: block; font: 700 18px/1.25 var(--font); letter-spacing: 0.06em; margin-top: 10px; }

/* Slide 2 */
.dots { display: grid; grid-template-columns: repeat(19, 1fr); gap: 14px; margin: 44px 0 0; }
.dots i { aspect-ratio: 1; border-radius: 50%; background: var(--light); }
.dots i.on { background: var(--red); }
.body { font: 500 31px/1.35 var(--font); max-width: 1180px; margin: 26px 0 0; }

/* Slide 3 */
.halves { display: grid; grid-template-columns: 1fr 1fr; margin-top: 50px; }
.half { padding-right: 40px; display: flex; flex-direction: column; }
.half + .half { border-left: 5px solid var(--ink); padding: 0 0 0 40px; }
.half .k { font: 900 30px/1 var(--font); text-transform: uppercase; letter-spacing: 0.02em; }
.half .k.win { color: var(--ink); } .half .k.loss { color: var(--red); }
.half h2 { font: 800 50px/1.02 var(--font); letter-spacing: -0.03em; margin: 0; }
.half h2 span { color: var(--red); }
.score { display: grid; grid-template-columns: auto 1fr; column-gap: 20px; align-items: baseline; margin-top: 34px; }
.score b { font: 900 136px/0.95 var(--font); letter-spacing: -0.04em; font-variant-numeric: tabular-nums; }
.score span { font: 700 24px/1.2 var(--font); text-transform: uppercase; color: var(--ink-2); }
.half p { font: 500 25px/1.35 var(--font); color: var(--ink-2); margin: 26px 0 0; }

/* Slide 4 */
.claims { margin-top: 50px; }
.claim { display: grid; grid-template-columns: 1fr 290px 370px; align-items: baseline; border-top: 3px solid var(--ink); padding: 20px 0 22px; }
.claim:last-child { border-bottom: 3px solid var(--ink); }
.claim .c { font: 700 34px/1.1 var(--font); letter-spacing: -0.01em; }
.claim .r { white-space: nowrap; font: 700 42px/1 var(--font); color: var(--grey); font-variant-numeric: tabular-nums; }
.claim .r.struck { text-decoration: line-through; text-decoration-color: var(--red); text-decoration-thickness: 5px; }
.claim .m { white-space: nowrap; font: 900 62px/1 var(--font); letter-spacing: -0.03em; text-align: right; font-variant-numeric: tabular-nums; }
.claim .m.no { color: var(--red); }
.heads { display: grid; grid-template-columns: 1fr 290px 370px; font: 700 20px/1 var(--font); text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-2); padding-bottom: 12px; }
.heads span:last-child { text-align: right; }
.fine { font: 500 21px/1.35 var(--font); color: var(--ink-2); margin-top: 18px; }

/* Slide 1: poster-scale bars, the number set on the bar */
.vs { margin-top: 72px; display: grid; gap: 46px; }
.vs .d { font: 900 76px/1 var(--font); letter-spacing: -0.04em; text-align: right; font-variant-numeric: tabular-nums; }
.vs .row { display: grid; grid-template-columns: 230px 1fr 190px; align-items: center; column-gap: 28px; }
.vs .name { font: 800 32px/1.05 var(--font); letter-spacing: -0.01em; }
.vs .name small { display: block; font: 600 20px/1.3 var(--font); text-transform: uppercase; letter-spacing: 0.03em; color: var(--ink-2); margin-top: 6px; }
.vs .bars { display: grid; gap: 10px; }
.vs .bar { height: 112px; display: flex; align-items: center; justify-content: flex-end; padding: 0 22px;
  font: 900 54px/1 var(--font); letter-spacing: -0.03em; color: var(--bg); font-variant-numeric: tabular-nums; }
.vs .bar.off { background: var(--ink); } .vs .bar.on { background: var(--red); }
.vs .bar em { font: 700 22px/1 var(--font); font-style: normal; letter-spacing: 0.03em; text-transform: uppercase; margin-right: auto; }
.aside { font: 600 26px/1.3 var(--font); color: var(--ink-2); }
.aside b { color: var(--ink); font-weight: 800; }
.foot { margin-top: auto; border-top: 5px solid var(--ink); padding: 18px 0 56px; display: flex; justify-content: space-between;
  font: 700 22px/1 var(--font); text-transform: uppercase; letter-spacing: 0.03em; }
.foot span:last-child { color: var(--red); }
/* Slide 2: the field of 114 tasks is the image */
.field { display: grid; grid-template-columns: repeat(17, 1fr); gap: 16px; margin-top: 60px; }
.field i { aspect-ratio: 1; border-radius: 50%; background: var(--light); }
.field i.on { background: var(--red); }

/* Evidence slides */
.stacks { display: grid; grid-template-columns: 1fr 1fr; column-gap: 64px; margin-top: 46px; }
.stack h3 { font: 800 30px/1 var(--font); letter-spacing: -0.01em; margin: 0 0 6px; display: flex; justify-content: space-between; align-items: baseline; }
.stack h3 span { font: 700 20px/1 var(--font); text-transform: uppercase; letter-spacing: 0.03em; color: var(--ink-2); }
.stack svg { display: block; width: 100%; }
.stack .meta { font: 600 22px/1.3 var(--font); color: var(--ink-2); margin-top: 12px; }
.stack .meta b { color: var(--ink); font-weight: 800; }
.delta { position: absolute; right: 88px; font: 900 150px/0.9 var(--font); letter-spacing: -0.04em; color: var(--red); text-align: right; }
.delta small { display: block; font: 700 22px/1.2 var(--font); letter-spacing: 0.03em; text-transform: uppercase; color: var(--ink); margin-top: 8px; }
.cols { display: grid; grid-template-columns: repeat(12, 1fr); column-gap: 10px; margin-top: 50px; align-items: end; }
.col { display: flex; flex-direction: column-reverse; align-items: center; gap: 9px; }
.col i { width: 38px; height: 38px; border-radius: 50%; background: var(--light); flex: none; }
.col i.on { background: var(--red); }
.col span { font: 700 16px/1.15 var(--font); text-transform: uppercase; letter-spacing: 0.02em; text-align: center; color: var(--ink-2); min-height: 38px; }
.col.hit span { color: var(--red); }
.discs { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 18px; }
.discs i { width: 46px; height: 46px; border-radius: 50%; background: var(--c); }
.discs i.f { background: transparent; border: 5px solid var(--c); }
.drow2 { display: grid; grid-template-columns: 1fr auto; align-items: end; margin-top: 30px; }
.drow2 b { font: 900 64px/0.9 var(--font); letter-spacing: -0.04em; font-variant-numeric: tabular-nums; }
.drow2 span { font: 700 20px/1 var(--font); text-transform: uppercase; letter-spacing: 0.03em; color: var(--ink-2); }
</style>
</head>
<body>
<script id="data" type="application/json">__DATA__</script>
<section class="slide" id="s1"></section>
<section class="slide" id="s2"></section>
<section class="slide" id="s3"></section>
<section class="slide" id="s4"></section>
<script>
// Numbers and marks come from the summary (arms, runs, activation); words from copy.json's
// "slides" block (C); task labels from meta.json (T). Nothing about a specific skill is hardcoded.
const D = JSON.parse(document.getElementById("data").textContent);
const A = D.arms, P = A.always || A.skill, B = A.noskill, S = A.skill, C = D.s, T = D.tasks;
const ARM_ON = A.always ? "always" : "skill";
const pct = (x) => Math.round(x * 100) + "%";
const chg = (p, b) => { const v = Math.round((p - b) / b * 100); return (v > 0 ? "+" : v < 0 ? "−" : "±") + Math.abs(v) + "%"; };
const N = Object.values(A).reduce((t, a) => t + a.usable, 0);
const topBar = () => `<div class="top"></div>`;
const foot = (n) => `<div class="foot"><span>${C.foot.replace("{n}", N)}</span><span>${n}/4</span></div>`;
const name = C.skill_label;

// Slide 1: one bar per graded run, as long as the lines of code it added, longest first.
const runsOf = (arm) => D.runs.filter((r) => r.arm === arm);
const MAXLOC = Math.max(20, Math.ceil(Math.max(...D.runs.map((r) => r.loc)) / 20) * 20);
const ROW = Math.min(5, 430 / Math.max(runsOf("noskill").length, runsOf(ARM_ON).length)), BAR = ROW * 0.72;
const stack = (arm, color, fade) => {
  const runs = runsOf(arm).sort((a, b) => b.loc - a.loc);
  const h = Math.max(runsOf("noskill").length, runsOf(ARM_ON).length) * ROW;
  const mean = runs.reduce((t, r) => t + r.loc, 0) / runs.length;
  const x = (v) => v / MAXLOC * 600;
  const bars = runs.map((r, i) => `<rect x="0" y="${i * ROW}" width="${Math.max(1.5, x(r.loc))}" height="${BAR}" fill="${r.passed ? color : fade}"/>`).join("");
  const ticks = [0, 1, 2, 3, 4].map((i) => i * MAXLOC / 4).map((v, i) => `<line x1="${x(v)}" x2="${x(v)}" y1="${h + 4}" y2="${h + 14}" stroke="var(--ink)" stroke-width="2"/><text x="${x(v)}" y="${h + 40}" font-size="20" font-weight="700" text-anchor="${i === 0 ? "start" : i === 4 ? "end" : "middle"}" fill="var(--ink-2)">${v}</text>`).join("");
  return { svg: `<svg viewBox="0 0 600 ${h + 46}" aria-hidden="true">${bars}<line x1="${x(mean)}" x2="${x(mean)}" y1="-4" y2="${h}" stroke="var(--ink)" stroke-width="3" stroke-dasharray="8 6"/>${ticks}</svg>`,
    mean, n: runs.length, passed: runs.filter((r) => r.passed).length };
};
const off = stack("noskill", "var(--ink)", "#b9bbb7"), on = stack(ARM_ON, "var(--red)", "#f1aaa4");
document.getElementById("s1").innerHTML = `${topBar()}
  <div class="verdict" style="background:var(--${C.stamp_color === "fail" ? "red" : C.stamp_color === "win" ? "win" : "red"})">${C.stamp}<small>${C.stamp_small.replace(" · ", "<br>")}</small></div>
  <h1>${C.headline}</h1>
  <div class="stacks">
    <div class="stack"><h3>Without ${name}<span>${off.n} runs</span></h3>${off.svg}
      <div class="meta"><b>${off.mean.toFixed(1)}</b> lines per run on average · <b>${off.passed} of ${off.n}</b> passed</div></div>
    <div class="stack" style="position:relative"><h3>With ${name}<span>${on.n} runs</span></h3>${on.svg}
      <div class="delta" style="top:120px;right:0">${chg(on.mean, off.mean)}<small>code written</small></div>
      <div class="meta"><b>${on.mean.toFixed(1)}</b> lines per run on average · <b>${on.passed} of ${on.n}</b> passed</div></div>
  </div>
  <p class="aside" style="margin-top:18px">Each bar is one run, as long as the lines of code it added; the dashed line is the average. Pale bars failed the hidden test.</p>
  ${foot(1)}`;

// Slide 2: one dot per run with the skill installed, grouped by task; red where the agent loaded it.
const order = Object.keys(T);
const byTask = Object.fromEntries(order.map((k) => [k, D.activation.filter((a) => a.task === k)]));
const hits = new Set(D.activation.filter((a) => a.fired).map((a) => a.task));
document.getElementById("s2").innerHTML = `${topBar()}
  <h1>${C.activation_title}</h1>
  <div class="cols" style="grid-template-columns:repeat(${order.length},1fr)">${order.map((k) => `<div class="col ${hits.has(k) ? "hit" : ""}"><span>${T[k].short || T[k].label}</span>${byTask[k].map((a) => `<i class="${a.fired ? "on" : ""}"></i>`).join("")}</div>`).join("")}</div>
  <p class="aside" style="margin-top:34px">${C.activation_body}</p>
  ${foot(2)}`;

// Slide 3: one disc per graded run on the tasks that flipped.
const discs = (t, c) => `<div class="discs" style="--c:${c}">${Array.from({ length: t.usable }, (_, i) => `<i class="${i < t.passes ? "" : "f"}"></i>`).join("")}</div>`;
const half = (c) => {
  const p = P.tasks[c.task], b = B.tasks[c.task];
  return `<div class="half"><h2>${c.title}</h2>
    <div class="drow2"><span>with ${name}</span><b>${p.passes}/${p.usable}</b></div>${discs(p, "var(--red)")}
    <div class="drow2"><span>without</span><b style="color:var(--grey)">${b.passes}/${b.usable}</b></div>${discs(b, "var(--ink)")}
    <p>${c.what}</p></div>`;
};
document.getElementById("s3").innerHTML = `${topBar()}
  <h1>${C.cases_title}</h1>
  <div class="halves">${C.cases.slice(0, 2).map(half).join("")}</div>
  <p class="aside" style="margin:26px 0 0">One disc per run; hollow discs failed. ${C.cases_footnote}</p>
  ${foot(3)}`;

// Slide 4: the author's claims next to the measured numbers; struck through when not reproduced.
document.getElementById("s4").innerHTML = `${topBar()}
  <h1>${C.claims_title}</h1>
  <div class="claims"><div class="heads"><span>Claim</span><span>Claimed</span><span>Measured</span></div>
  ${D.claims.map((c) => `<div class="claim"><span class="c">${c.claim}</span><span class="r ${c.ok === "ok" ? "" : "struck"}">${c.readme}</span><span class="m ${c.ok === "no" ? "no" : ""}">${c.measured}</span></div>`).join("")}
  </div>
  <p class="fine">Struck through: not reproduced here. ${C.claims_foot}</p>
  ${foot(4)}`;
</script>
</body>
</html>
